<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PRIVATE ACCESS</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  :root {
    --bg: #02060a;
    --panel: rgba(5, 11, 19, 0.86);
    --border: rgba(96, 104, 122, 0.36);
    --border-focus: rgba(255, 196, 90, 0.78);
    --dim: rgb(96, 104, 122);
    --sign: rgb(176, 168, 196);
    --accent: rgb(255, 196, 90);
    --text: rgb(224, 232, 244);
    --err: rgb(245, 108, 108);
    --ok: rgb(120, 214, 152);
    --mono: Consolas, Menlo, "DejaVu Sans Mono", "Courier New", "Noto Sans TC", monospace;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
  }

  /* Ambient monochrome ASCII background matching the main canvas palette */
  #bgCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }

  /* Minimal corner HUD */
  .hud-top-right {
    position: fixed;
    top: 14px;
    right: 16px;
    z-index: 2;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.03em;
    pointer-events: none;
  }
  .hud-bottom-left {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 2;
    font-size: 12px;
    line-height: 1.65;
    pointer-events: none;
  }
  .hud-sign {
    color: var(--sign);
  }
  .hud-dim {
    color: var(--dim);
  }

  /* Center login wrapper */
  #gate {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: opacity 0.45s ease;
  }
  #gate.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 390px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 30px 26px 26px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
  }
  /* Subtle terminal corner ticks */
  .card::before, .card::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    border-color: var(--accent);
    border-style: solid;
    opacity: 0.75;
    pointer-events: none;
  }
  .card::before {
    top: -1px;
    left: -1px;
    border-width: 1px 0 0 1px;
  }
  .card::after {
    bottom: -1px;
    right: -1px;
    border-width: 0 1px 1px 0;
  }

  .kicker {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .title {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--sign);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .field input {
    width: 100%;
    background: rgba(2, 6, 10, 0.82);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 11px 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    border-radius: 2px;
  }
  .field input.has-toggle {
    padding-right: 54px;
  }
  .field input::placeholder {
    color: rgba(96, 104, 122, 0.65);
  }
  .field input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 2px rgba(255, 196, 90, 0.12);
  }
  .pw-toggle {
    position: absolute;
    right: 8px;
    background: transparent;
    border: none;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 6px;
    cursor: pointer;
    transition: color 0.15s;
  }
  .pw-toggle:hover {
    color: var(--accent);
  }

  .submit-btn {
    width: 100%;
    margin-top: 8px;
    padding: 12px 16px;
    background: rgba(255, 196, 90, 0.08);
    border: 1px solid rgba(255, 196, 90, 0.65);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.2s, border-color 0.2s, transform 0.1s;
  }
  .submit-btn:hover:not(:disabled) {
    background: rgba(255, 196, 90, 0.18);
    border-color: var(--accent);
  }
  .submit-btn:active:not(:disabled) {
    transform: translateY(1px);
  }
  .submit-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .status {
    min-height: 20px;
    margin-top: 14px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--dim);
    word-break: break-word;
  }
  .status.error {
    color: var(--err);
  }
  .status.ok {
    color: var(--ok);
  }

  /* Protected content mount (only populated after Firebase Auth + Firestore verification) */
  #vaultFrame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: var(--bg);
    z-index: 10;
    display: none;
  }
  #vaultFrame.active {
    display: block;
  }
  #signOutBtn {
    position: fixed;
    bottom: 14px;
    right: 16px;
    z-index: 20;
    display: none;
    background: rgba(2, 6, 10, 0.65);
    border: 1px solid rgba(96, 104, 122, 0.45);
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 3px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  #signOutBtn.active {
    display: block;
  }
  #signOutBtn:hover {
    color: var(--accent);
    border-color: rgba(255, 196, 90, 0.65);
  }
</style>
</head>
<body>
<canvas id="bgCanvas" aria-hidden="true"></canvas>

<div class="hud-top-right" id="hudStatus">• status = locked</div>
<div class="hud-bottom-left" id="hudMeta">
  <div class="hud-sign">PRIVATE GATEWAY</div>
  <div class="hud-dim">auth firebase &nbsp;&nbsp; access restricted</div>
</div>

<main id="gate">
  <section class="card" aria-labelledby="gateTitle">
    <div class="kicker">• restricted node</div>
    <h1 class="title" id="gateTitle">ACCESS REQUIRED</h1>
    <p class="subtitle">請使用授權的電子郵件帳號登入驗證。</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="emailInput">Email</label>
        <div class="input-wrap">
          <input
            id="emailInput"
            type="email"
            autocomplete="username"
            placeholder="name@example.com"
            required
          >
        </div>
      </div>

      <div class="field">
        <label for="passwordInput">Password</label>
        <div class="input-wrap">
          <input
            id="passwordInput"
            class="has-toggle"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          >
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="顯示或隱藏密碼">SHOW</button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">VERIFY &amp; ENTER</button>
      <div class="status" id="statusMsg" role="status" aria-live="polite"></div>
    </form>
  </section>
</main>

<iframe id="vaultFrame" title="Protected Content" allow="autoplay"></iframe>
<button type="button" id="signOutBtn">SIGN OUT</button>

<!-- Firebase Compat SDK (pinned version for GitHub Pages static hosting) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
(() => {
  'use strict';

  // =========================================================================
  // 1. Firebase & 授權帳號設定（部署到 GitHub 前請替換為你的實際設定）
  // =========================================================================
  const FIREBASE_CONFIG = {
    apiKey: 'YOUR_FIREBASE_API_KEY',
    authDomain: 'YOUR_PROJECT_ID.firebaseapp.com',
    projectId: 'YOUR_PROJECT_ID',
    storageBucket: 'YOUR_PROJECT_ID.firebasestorage.app',
    messagingSenderId: 'YOUR_MESSAGING_SENDER_ID',
    appId: 'YOUR_APP_ID'
  };

  // 只允許這個 Email 進入並讀取 Firestore 中的受保護頁面原始碼
  const ALLOWED_EMAIL = 'YOUR_ALLOWED_EMAIL@example.com';

  // Firestore 儲存受保護 HTML 原始碼的位置：collection / doc / field
  const VAULT_COLLECTION = 'private_pages';
  const VAULT_DOC_ID = 'main';
  const VAULT_HTML_FIELD = 'html';

  // =========================================================================
  // 2. 極簡單色 ASCII 點陣背景（無任何節日或內容提示）
  // =========================================================================
  const bgCanvas = document.getElementById('bgCanvas');
  const bgCtx = bgCanvas.getContext('2d', { alpha: false });
  let bgW = 0, bgH = 0, bgCols = 0, bgRows = 0;
  let bgNodes = [];
  let bgRunning = true;

  function initBg() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    bgW = window.innerWidth;
    bgH = window.innerHeight;
    bgCanvas.width = Math.floor(bgW * dpr);
    bgCanvas.height = Math.floor(bgH * dpr);
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    bgCols = Math.ceil(bgW / 18);
    bgRows = Math.ceil(bgH / 22);
    bgNodes = [];
    const glyphs = ['.', '.', '.', ':', '+', '·'];
    for (let i = 0; i < 140; i++) {
      bgNodes.push({
        x: Math.random() * bgW,
        y: Math.random() * bgH,
        vy: 6 + Math.random() * 14,
        phase: Math.random() * Math.PI * 2,
        ch: glyphs[Math.floor(Math.random() * glyphs.length)],
        alpha: 0.14 + Math.random() * 0.28
      });
    }
  }

  let bgLast = performance.now();
  function drawBg(now) {
    if (!bgRunning) return;
    requestAnimationFrame(drawBg);
    const dt = Math.min((now - bgLast) / 1000, 0.1);
    bgLast = now;

    bgCtx.fillStyle = '#02060a';
    bgCtx.fillRect(0, 0, bgW, bgH);

    // Subtle static perspective dot matrix in lower half
    bgCtx.font = '12px Consolas, Menlo, monospace';
    bgCtx.textAlign = 'center';
    bgCtx.textBaseline = 'middle';

    const startRow = Math.floor(bgRows * 0.42);
    for (let r = startRow; r < bgRows; r += 2) {
      const frac = (r - startRow) / Math.max(1, bgRows - startRow);
      const a = 0.08 + 0.18 * frac;
      bgCtx.fillStyle = `rgba(96, 110, 140, ${a.toFixed(3)})`;
      const py = r * 22;
      for (let c = (r % 2); c < bgCols; c += 2) {
        bgCtx.fillText('.', c * 18 + 9, py);
      }
    }

    // Subtle drifting monochrome ambient glyphs
    for (let i = 0; i < bgNodes.length; i++) {
      const n = bgNodes[i];
      n.y += n.vy * dt;
      if (n.y > bgH + 10) {
        n.y = -10;
        n.x = Math.random() * bgW;
      }
      const pulse = n.alpha * (0.65 + 0.35 * Math.sin(now * 0.0018 + n.phase));
      bgCtx.fillStyle = `rgba(148, 162, 190, ${pulse.toFixed(3)})`;
      bgCtx.fillText(n.ch, n.x, n.y);
    }
  }

  initBg();
  window.addEventListener('resize', initBg);
  requestAnimationFrame(drawBg);

  // =========================================================================
  // 3. DOM 參照與 UI 狀態
  // =========================================================================
  const gateEl = document.getElementById('gate');
  const hudStatus = document.getElementById('hudStatus');
  const hudMeta = document.getElementById('hudMeta');
  const loginForm = document.getElementById('loginForm');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const pwToggle = document.getElementById('pwToggle');
  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');
  const vaultFrame = document.getElementById('vaultFrame');
  const signOutBtn = document.getElementById('signOutBtn');

  function setStatus(text, type = '') {
    statusMsg.textContent = text;
    statusMsg.className = 'status' + (type ? ' ' + type : '');
  }

  function setBusy(busy) {
    submitBtn.disabled = busy;
    submitBtn.textContent = busy ? 'VERIFYING...' : 'VERIFY & ENTER';
  }

  pwToggle.addEventListener('click', () => {
    const show = passwordInput.type === 'password';
    passwordInput.type = show ? 'text' : 'password';
    pwToggle.textContent = show ? 'HIDE' : 'SHOW';
  });

  // =========================================================================
  // 4. Firebase 初始化與權限驗證
  // =========================================================================
  const isConfigured =
    FIREBASE_CONFIG.apiKey &&
    !FIREBASE_CONFIG.apiKey.startsWith('YOUR_') &&
    typeof window.firebase !== 'undefined';

  let auth = null;
  let db = null;

  if (isConfigured) {
    try {
      if (!window.firebase.apps.length) {
        window.firebase.initializeApp(FIREBASE_CONFIG);
      }
      auth = window.firebase.auth();
      db = window.firebase.firestore();
    } catch (err) {
      setStatus('Firebase 初始化失敗，請檢查設定值。', 'error');
    }
  }

  function showProtectedHtml(htmlSource) {
    bgRunning = false;
    gateEl.classList.add('hidden');
    hudStatus.style.display = 'none';
    hudMeta.style.display = 'none';
    vaultFrame.srcdoc = htmlSource;
    vaultFrame.classList.add('active');
    signOutBtn.classList.add('active');
  }

  function resetToGate(msg = '') {
    vaultFrame.classList.remove('active');
    vaultFrame.srcdoc = '';
    signOutBtn.classList.remove('active');
    gateEl.classList.remove('hidden');
    hudStatus.style.display = '';
    hudMeta.style.display = '';
    hudStatus.textContent = '• status = locked';
    if (!bgRunning) {
      bgRunning = true;
      bgLast = performance.now();
      requestAnimationFrame(drawBg);
    }
    setBusy(false);
    if (msg) setStatus(msg, 'error');
  }

  async function verifyAndLoadVault(user) {
    if (!user || !user.email) {
      resetToGate();
      return;
    }

    // 嚴格比對唯一授權郵件帳號
    if (user.email.trim().toLowerCase() !== ALLOWED_EMAIL.trim().toLowerCase()) {
      await auth.signOut();
      resetToGate('此帳號無權存取此頁面。');
      return;
    }

    hudStatus.textContent = '• status = verifying';
    setStatus('驗證通過，正在載入內容...', 'ok');

    try {
      const snap = await db.collection(VAULT_COLLECTION).doc(VAULT_DOC_ID).get();
      if (!snap.exists || !snap.data() || !snap.data()[VAULT_HTML_FIELD]) {
        await auth.signOut();
        resetToGate('找不到受保護的內容文件，請確認 Firestore 設定。');
        return;
      }
      showProtectedHtml(String(snap.data()[VAULT_HTML_FIELD]));
    } catch (err) {
      await auth.signOut();
      resetToGate('權限驗證失敗，無法讀取受保護內容。');
    }
  }

  if (auth) {
    auth.onAuthStateChanged((user) => {
      if (user) {
        verifyAndLoadVault(user);
      }
    });
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      setStatus('請輸入電子郵件與密碼。', 'error');
      return;
    }

    if (!isConfigured || !auth || !db) {
      setStatus('尚未填入 Firebase 設定（請於原始碼中更新 FIREBASE_CONFIG 與 ALLOWED_EMAIL）。', 'error');
      return;
    }

    // 預先阻擋非指定帳號，不額外洩漏任何資訊
    if (email.toLowerCase() !== ALLOWED_EMAIL.trim().toLowerCase()) {
      setStatus('帳號或密碼錯誤，無法存取。', 'error');
      return;
    }

    setBusy(true);
    setStatus('驗證中...', '');

    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      await verifyAndLoadVault(cred.user);
    } catch (err) {
      setBusy(false);
      setStatus('帳號或密碼錯誤，請再試一次。', 'error');
    }
  });

  signOutBtn.addEventListener('click', async () => {
    if (auth) {
      try {
        await auth.signOut();
      } catch (_) {}
    }
    emailInput.value = '';
    passwordInput.value = '';
    setStatus('已登出。', '');
    resetToGate();
  });
})();
</script>
</body>
</html>
